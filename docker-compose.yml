services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: complexo-santos-schein-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: complexo
      APP_USER_PASSWORD: complexo
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  oracle-data:
